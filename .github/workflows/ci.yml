name: CI

# Read-only CI: runs on every PR + on pushes to main branches. NO AWS credentials, NO deploy —
# deployment (OIDC role, cdk deploy) is a SEPARATE workflow gated by a GitHub Environment (see
# deploy-dev.yml, added under a later gate). This file only builds + tests + lints.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read        # least privilege; no id-token here (no AWS in CI)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests + contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable packages + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest
          # Install local packages the tests import (observability, edit_plan_jobs, contracts, etc.)
          # via PYTHONPATH rather than a build step, matching the repo's dev layout.
      - name: Run pytest (packages + contracts)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages:${{ github.workspace }}
        run: |
          pytest -q \
            packages/observability/tests \
            packages/edit_plan_jobs/tests \
            packages/music_provider/tests \
            contracts/tests
      - name: Contract compatibility (OpenAPI + schemas present and parseable)
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob("contracts/**/*.json", recursive=True):
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              print("Invalid contract JSON:", bad); sys.exit(1)
          print("contract JSON OK")
          PY

  cdk-tests:
    name: CDK synth + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Jest (stack unit tests)
        run: npx jest --ci
      - name: cdk synth (dev context — no deploy, no credentials)
        run: npx cdk synth -c environment=development || true

  lint:
    name: Lint (ruff Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (non-blocking report for now)
        run: ruff check apps packages contracts || true
