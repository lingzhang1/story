name: CI

# Read-only CI: runs on every PR + on pushes to main branches. NO AWS credentials, NO deploy —
# deployment (OIDC role, cdk deploy) is a SEPARATE workflow gated by a GitHub Environment (see
# deploy-dev.yml, added under a later gate). This file only builds + tests + lints.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read        # least privilege; no id-token here (no AWS in CI)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests + contract compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable packages + test deps)
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest boto3 fastapi httpx python-multipart
          # boto3 is a declared apps/api dependency (pyproject.toml) exercised by the music_provider
          # auth test; fastapi/httpx back the TestClient used by the endpoint tests. Installed here so
          # CI runs those suites as written rather than erroring on a missing import.
      - name: Run pytest (packages + contracts)
        env:
          PYTHONPATH: ${{ github.workspace }}/packages:${{ github.workspace }}
        run: |
          # Discovery over the package + contract trees: collects whatever test suites exist on THIS
          # branch (the baseline has edit_plan_jobs/music_provider/contracts; the feature PR adds
          # observability). Passing explicit dirs would hard-fail (pytest exit 4) on a branch that does
          # not yet contain one of them — discovery runs the real suites present without weakening them.
          pytest -q packages contracts
      - name: Contract compatibility (OpenAPI + schemas present and parseable)
        run: |
          python - <<'PY'
          import json, glob, sys
          bad = []
          for f in glob.glob("contracts/**/*.json", recursive=True):
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append((f, str(e)))
          if bad:
              print("Invalid contract JSON:", bad); sys.exit(1)
          print("contract JSON OK")
          PY

  cdk-tests:
    name: CDK synth + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build the Lambda worker asset (git-ignored; CDK fromAsset needs it present)
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install --upgrade pip >/dev/null 2>&1 || true
          bash scripts/build_worker_asset.sh
      - name: Jest (stack unit tests)
        run: npx jest --ci
      - name: cdk synth (dev context — no deploy, no credentials)
        run: npx cdk synth -c environment=development || true

  lint:
    name: Lint (ruff Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff (non-blocking report for now)
        run: ruff check apps packages contracts || true
